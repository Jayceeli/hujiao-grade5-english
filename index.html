<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6">
<title>沪教版五年级上册英语点读 · 2026</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">五年级上册英语点读<small>沪教版 · 五四制 · 2026新版</small></div>
    <div class="mode-note"><b>点句子</b>：系统英语语音<br><b>原版音频</b>：出版社配套音轨<br><b>Starter · At school</b>：已做原版逐句对齐</div>
    <input id="search" class="search" placeholder="搜索课文、单词、句型…">
    <nav id="nav" class="nav"></nav>
  </aside>
  <main class="main">
    <header class="hero">
      <div><h1 id="title">加载中…</h1><div id="range" class="sub"></div></div>
      <button id="stopAll" class="ghost-btn">■ 停止</button>
    </header>
    <div class="player">
      <div class="player-title"><span>🎧 原版教材音频</span><span id="audioStatus" class="status"></span></div>
      <audio id="audio" controls preload="metadata" src="assets/audio-sprite.ogg"></audio>
      <div class="controls">
        <span id="now">选择“原版音频”或点击一句课文开始点读</span>
        <label>速度 <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label>
        <label class="pill"><input id="loop" type="checkbox"> 循环</label>
      </div>
    </div>
    <div id="content"></div>
    <footer class="footer">教材文字与配套音频来自用户提供的学习资料。本页面用于个人学习。在线版为节省流量对原版音频做了语音优化压缩；文字按教材页序整理。</footer>
  </main>
</div>
<script src="app.js"></script>
</body></html>
